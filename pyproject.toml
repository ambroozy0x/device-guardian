[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "device-guardian"
version = "0.1.0"
description = "A zero-cost, personal-use anti-theft & intrusion alert system for PC and Android."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Device Guardian Contributors" }]
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.8.0.76",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
